<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#6955c7"><title>Devoirs IA V5 — Programmes et cours enrichis</title><style>
:root{font-family:system-ui,-apple-system,Arial,sans-serif;color:#25223c;background:#f5f3fc}*{box-sizing:border-box}body{margin:0}header{background:linear-gradient(125deg,#5b48b7,#9275dc);color:#fff;padding:24px 16px 28px;border-radius:0 0 22px 22px}header>div,main{max-width:850px;margin:auto}h1{margin:0;font-size:1.8rem}h2{font-size:1.25rem}h3{font-size:1.07rem}p{line-height:1.65}main{padding:14px}button,select{font:inherit}button{border:0;border-radius:12px;padding:12px 15px;background:#6955c7;color:white;font-weight:650;cursor:pointer}button:disabled{opacity:.55}button.light{background:#eee9fc;color:#4e389c}button.selected{background:#46318f;color:white}.nav{display:flex;gap:6px;overflow-x:auto;padding:4px 0}.nav button{flex:1;min-width:max-content}.card{background:#fff;border-radius:18px;padding:17px;margin:12px 0;box-shadow:0 3px 14px #34236512}label{display:block;font-weight:700;margin:12px 0 5px}select{width:100%;padding:11px;border-radius:10px;border:1px solid #d2caeb;background:white}.row{display:flex;align-items:center;gap:9px;flex-wrap:wrap}.row>*{flex:1}.muted{color:#655d78;font-size:.91rem}.notice{background:#f1edff;border-radius:12px;padding:12px;margin:12px 0}.lesson{background:#faf9ff;border-left:4px solid #8068d4;padding:12px 14px;margin:12px 0;border-radius:8px}.answers{display:grid;gap:8px;margin:12px 0}.answers button{text-align:left;background:#f0ecfc;color:#28203f;border:2px solid transparent}.answers button.good{border-color:#168a57;background:#ddf7e9}.answers button.bad{border-color:#c85151;background:#ffebeb}.answers button.chosen{border-color:#7152cc}.bar{height:9px;background:#e8e2f8;border-radius:20px;overflow:hidden}.bar>div{height:100%;background:#6e58c7;transition:width .2s}.timer{font-variant-numeric:tabular-nums;font-size:1.2rem;font-weight:800}.danger{color:#a22d37}.pill{background:#eee8ff;color:#5b459e;padding:5px 10px;border-radius:20px;font-size:.85rem}.hidden{display:none}footer{text-align:center;font-size:.8rem;color:#716b80;padding:24px}.qtitle{font-weight:700;font-size:1.08rem}.coursebtn{width:100%;text-align:left;margin:5px 0;background:#f0ebfc;color:#3c2b7a}.smallbtn{padding:8px 10px;font-size:.9rem}@media(min-width:680px){.columns{display:grid;grid-template-columns:1fr 1fr;gap:12px}}</style></head><body><header><div><h1>🎓 Devoirs IA V5</h1><p>Du collège au brevet · Gratuit · Sans compte · Fonctionne hors ligne</p></div></header><main><nav class="nav"><button data-tab="cours">📚 Cours</button><button data-tab="quiz">🧠 Quiz</button><button data-tab="brevet">🏅 Brevet blanc</button><button data-tab="progres">📈 Progrès</button></nav><section class="card" id="selectors"><div class="row"><div><label for="grade">Classe</label><select id="grade"></select></div><div><label for="subject">Matière</label><select id="subject"></select></div></div></section><section id="content"></section><footer>Devoirs IA — Version de travail V4. Contenus originaux à enrichir et à vérifier avec les programmes en vigueur. Aucun service IA connecté pour l’instant.</footer></main><script>
const COURSES={"6e":{"Mathématiques":[["Fractions","Une fraction a/b représente a parts quand l’unité est partagée en b parts égales (b non nul). Le dénominateur indique le nombre de parts et le numérateur celles que l’on prend.","3/4 de 20 = (20 ÷ 4) × 3 = 15.","Dessine 4 groupes identiques, puis prends-en 3.","Combien font 2/5 de 30 ?","12, car 30 ÷ 5 × 2 = 12."],["Nombres décimaux","Un nombre décimal possède une partie entière et une partie décimale. Les dixièmes, centièmes et millièmes correspondent aux positions après la virgule.","3,45 = 3 unités + 4 dixièmes + 5 centièmes.","Aligne les virgules pour additionner deux décimaux.","Calcule 2,5 + 0,75.","3,25."],["Périmètres et aires","Le périmètre mesure le tour d’une figure, en unités de longueur. L’aire mesure la surface, en unités carrées.","Rectangle 5 cm × 3 cm : périmètre 2 × (5 + 3) = 16 cm ; aire 5 × 3 = 15 cm².","Repère si l’on demande le contour ou la surface.","Aire d’un rectangle de 7 cm sur 4 cm ?","28 cm²."]],"Français":[["Nature des mots","Le nom désigne une personne, une chose ou une idée ; le déterminant l’accompagne ; l’adjectif précise le nom ; le verbe exprime une action ou un état.","Dans « Le petit chat dort », Le = déterminant, petit = adjectif, chat = nom, dort = verbe.","Demande-toi si le mot peut changer de temps : c’est souvent un verbe.","Quelle est la nature de « rouge » dans « une robe rouge » ?","Adjectif qualificatif."],["Sujet et verbe","Le sujet indique qui fait l’action ou de qui l’on parle. Le verbe s’accorde avec le sujet en personne et en nombre.","« Les élèves écrivent » : sujet « Les élèves », verbe « écrivent ».","Pose la question « Qui est-ce qui… ? » devant le verbe.","Dans « Ma sœur chante », quel est le sujet ?","Ma sœur."],["Récit et personnages","Un récit présente souvent une situation initiale, un événement perturbateur, des péripéties et une fin. Le narrateur raconte les événements.","Une enfant perd sa clé, la cherche puis la retrouve : ce sont les étapes d’un petit récit.","Repère qui raconte et ce qui change dans l’histoire.","Comment appelle-t-on celui qui raconte l’histoire ?","Le narrateur."]],"Anglais":[["Se présenter","Pour dire son nom, on emploie « My name is… » ou « I am… ». Pour l’âge : « I am twelve years old ».","My name is Sam. I am eleven years old.","Commence par une phrase courte, puis ajoute l’âge et la ville.","Traduis « Je m’appelle Léa ».","My name is Léa."],["Be et have","Au présent, be : I am, you are, he/she is, we/they are. Have : I/you/we/they have, he/she has.","She is happy. He has a bike.","Repère le sujet avant de choisir la forme du verbe.","Complète : « She … a cat. » (have)","has."],["Questions simples","Pour demander une information : What (quoi), Where (où), Who (qui), When (quand), How (comment).","Where do you live? — I live in Lyon.","Choisis d’abord le mot interrogatif adapté à l’information cherchée.","Quel mot anglais signifie « où » ?","Where."]],"Histoire-géo":[["Préhistoire","La préhistoire précède l’invention de l’écriture. Les humains ont pratiqué la chasse et la cueillette, puis développé l’agriculture et l’élevage.","Le Néolithique est marqué par le développement de l’agriculture et de villages.","Place les changements sur une frise chronologique.","Quelle activité se développe au Néolithique ?","L’agriculture."],["Premières civilisations","Les premières grandes civilisations urbaines se développent notamment en Mésopotamie et en Égypte. L’écriture permet de conserver des informations.","Les hiéroglyphes sont un système d’écriture de l’Égypte ancienne.","Localise les grands fleuves sur une carte.","Quel fleuve traverse l’Égypte ?","Le Nil."],["Habiter une métropole","Une métropole concentre habitants, emplois, transports et services. Les quartiers peuvent avoir des fonctions différentes.","Un centre-ville peut réunir commerces, administrations et transports.","Observe les mobilités entre centre et périphérie.","Cite un service présent dans une métropole.","Par exemple : un hôpital."]],"SVT":[["Les êtres vivants","Les êtres vivants naissent, se développent, se reproduisent et interagissent avec leur milieu. Ils peuvent être classés selon des caractères partagés.","Un chat et un chien possèdent une colonne vertébrale : ce caractère peut servir au classement.","Compare les caractères observables, pas seulement le milieu de vie.","Quel caractère partagent un chat et un chien ?","Une colonne vertébrale."],["Chaînes alimentaires","Une chaîne alimentaire montre des relations de nutrition. Un producteur végétal peut être mangé par un herbivore, lui-même par un carnivore.","Herbe → lapin → renard.","Lis la flèche comme « est mangé par ».","Dans herbe → lapin → renard, qui mange le lapin ?","Le renard."],["Corps et effort","Les muscles ont besoin de dioxygène et de nutriments pour fonctionner. Pendant un effort, la respiration et le rythme cardiaque augmentent.","Après une course, on respire plus vite pour répondre aux besoins de l’organisme.","Compare le rythme respiratoire avant et après l’effort.","Que devient généralement la fréquence respiratoire à l’effort ?","Elle augmente."]],"Physique-chimie":[["États de la matière","La matière existe sous forme solide, liquide ou gazeuse. Les changements d’état dépendent notamment de la température.","La glace fond : passage du solide au liquide.","Repère l’état avant et après le changement.","Comment s’appelle le passage de liquide à solide ?","La solidification."],["Mélanges","Un mélange homogène paraît uniforme ; un mélange hétérogène présente plusieurs constituants visibles. Dissoudre ne signifie pas faire disparaître la matière.","Eau et sel dissous : mélange homogène. Eau et huile : hétérogène.","Observe si tu distingues plusieurs phases.","Eau et huile forment quel type de mélange ?","Hétérogène."],["Électricité simple","Un circuit fermé permet le passage du courant. Une lampe s’allume si le générateur, les fils et la lampe forment une boucle adaptée.","Un interrupteur ouvert coupe la boucle et éteint la lampe.","Dessine la boucle avant de brancher les éléments.","Une lampe s’allume-t-elle dans un circuit ouvert ?","Non."]]},"5e":{"Mathématiques":[["Nombres relatifs","Les nombres relatifs peuvent être positifs ou négatifs. Sur une droite graduée, les négatifs se situent à gauche de zéro.","−3 + 5 = 2 ; −2 − 4 = −6.","Pour additionner, imagine des déplacements sur une droite graduée.","Calcule −4 + 7.","3."],["Proportionnalité","Deux grandeurs sont proportionnelles si l’on passe de l’une à l’autre en multipliant toujours par un même coefficient.","3 cahiers coûtent 6 € : 1 cahier coûte 2 € et 5 cahiers coûtent 10 €.","Commence par chercher le prix ou la quantité pour une unité.","Si 2 kg coûtent 8 €, combien coûtent 3 kg ?","12 €."],["Angles et triangles","La somme des angles d’un triangle est égale à 180°. Un triangle rectangle possède un angle droit de 90°.","Angles 50° et 60° : troisième angle = 180° − 110° = 70°.","Additionne les angles connus, puis soustrais à 180°.","Angles 40° et 90° : troisième angle ?","50°."]],"Français":[["Temps du récit","L’imparfait décrit souvent un arrière-plan ou une habitude ; le passé simple exprime fréquemment une action ponctuelle dans un récit littéraire.","« Il pleuvait quand la porte s’ouvrit. »","Distingue description durable et événement qui fait avancer l’histoire.","Quel temps est « pleuvait » ?","Imparfait."],["Compléments du verbe","Le COD complète directement un verbe ; le COI est souvent introduit par une préposition.","« Elle lit un livre » : un livre est COD. « Il parle à son ami » : à son ami est COI.","Cherche ce qui complète le verbe et la présence d’une préposition.","COD de « Paul mange une pomme » ?","Une pomme."],["Poésie","Un vers est une ligne de poème ; une strophe est un groupe de vers. Les rimes correspondent à des ressemblances sonores en fin de vers.","Une strophe de quatre vers s’appelle un quatrain.","Compte les vers et repère les sons finaux.","Comment appelle-t-on une strophe de quatre vers ?","Un quatrain."]],"Anglais":[["Présent simple","Le présent simple sert notamment aux habitudes. À la troisième personne du singulier, on ajoute souvent -s au verbe.","She plays football every Saturday.","Cherche les indices de fréquence : every day, often, usually.","Complète « He … to school » (walk).","walks."],["Présent en -ing","Be + verbe en -ing décrit souvent une action en cours.","They are reading now.","Vérifie la présence de am/is/are avant le verbe en -ing.","Complète « I … studying »","am."],["Passé simple régulier","Au prétérit, les verbes réguliers prennent souvent -ed. Les verbes irréguliers ont une forme à apprendre.","I visited London last year.","Repère un marqueur de passé : yesterday, last week.","Prétérit de « play » ?","played."]],"Histoire-géo":[["Moyen Âge","Le Moyen Âge européen connaît une société organisée autour de seigneuries, de paysans, de villes et de pouvoirs religieux et politiques.","Dans une seigneurie, les paysans cultivent des terres.","Distingue rôles du seigneur, des paysans et des habitants des villes.","Comment appelle-t-on le domaine d’un seigneur ?","Une seigneurie."],["Islam médiéval","À partir du VIIe siècle, l’islam se développe dans la péninsule Arabique et au-delà ; des villes deviennent des centres d’échanges et de savoirs.","Bagdad est un important centre intellectuel au Moyen Âge.","Situe les territoires et les échanges sur une carte.","Quelle ville fut un centre de savoir majeur ?","Bagdad."],["Ressources et eau","L’eau douce est une ressource inégalement répartie. Les usages agricoles, domestiques et industriels peuvent entrer en concurrence.","L’irrigation permet d’apporter de l’eau aux cultures.","Identifie la ressource, les usages et les tensions possibles.","Comment appelle-t-on l’apport d’eau aux cultures ?","L’irrigation."]],"SVT":[["Respiration","Les organes ont besoin de dioxygène. Chez l’humain, les poumons permettent des échanges gazeux entre l’air et le sang.","Le dioxygène passe de l’air des alvéoles vers le sang.","Suis le trajet de l’air jusqu’aux poumons.","Quel gaz est prélevé dans l’air par l’organisme ?","Le dioxygène."],["Digestion","Les aliments sont transformés en nutriments au cours de la digestion ; une grande partie des nutriments passe dans le sang au niveau de l’intestin grêle.","L’amidon est transformé en molécules plus simples lors de la digestion.","Distingue transformation des aliments et absorption des nutriments.","Où a lieu une grande partie de l’absorption des nutriments ?","Dans l’intestin grêle."],["Reproduction des plantes","Les fleurs peuvent produire des graines après pollinisation et fécondation. Les graines peuvent germer dans des conditions favorables.","Le pollen peut être transporté par des insectes.","Observe les étapes fleur → fruit/graines → germination.","Comment s’appelle le transport du pollen ?","La pollinisation."]],"Physique-chimie":[["Masse et volume","La masse se mesure avec une balance ; le volume mesure l’espace occupé. Les unités courantes sont le gramme et le litre.","1 L = 1 000 mL.","Vérifie l’unité demandée avant de convertir.","Convertis 0,5 L en mL.","500 mL."],["Circuits électriques","Dans un circuit en série, les dipôles sont sur une même boucle. Dans un circuit en dérivation, plusieurs branches existent.","Si une lampe d’un circuit simple en série est retirée, le circuit est ouvert.","Compte les branches du schéma.","Un circuit avec deux branches est-il en série ou en dérivation ?","En dérivation."],["Lumière","Dans un milieu transparent homogène, la lumière se propage en ligne droite. Une ombre apparaît quand un objet opaque bloque la lumière.","Un objet opaque placé devant une lampe crée une zone d’ombre.","Identifie source lumineuse, obstacle et écran.","Quel type d’objet bloque la lumière ?","Un objet opaque."]]},"4e":{"Mathématiques":[["Calcul littéral","Une expression littérale contient des lettres représentant des nombres. On peut réduire les termes semblables.","3x + 2x = 5x ; pour x = 4, 5x = 20.","Regroupe seulement les termes de même nature.","Réduis 7a − 2a.","5a."],["Équations","Résoudre une équation consiste à trouver les valeurs qui rendent l’égalité vraie. On effectue la même opération des deux côtés.","x + 5 = 12 donc x = 7.","Isole l’inconnue et vérifie en remplaçant.","Résous 3x = 21.","x = 7."],["Théorème de Pythagore","Dans un triangle rectangle, le carré de l’hypoténuse égale la somme des carrés des deux autres côtés.","Côtés de l’angle droit 3 et 4 : hypoténuse = 5, car 3² + 4² = 25.","Identifie l’angle droit et le côté opposé.","Hypoténuse pour des côtés 6 et 8 ?","10."]],"Français":[["Discours rapporté","Le discours direct cite les paroles ; le discours indirect les intègre à une phrase et peut modifier les pronoms et les temps.","Direct : « Je pars », dit-elle. Indirect : Elle dit qu’elle part.","Repère guillemets, verbes de parole et changements de pronoms.","« Il dit : “Je viens.” » est quel discours ?","Discours direct."],["Propositions","Une proposition contient généralement un verbe conjugué. Une phrase complexe comprend plusieurs propositions.","« Je rentre parce qu’il pleut » contient deux verbes conjugués.","Souligne les verbes conjugués avant de découper.","Combien de propositions dans « Je lis et tu écris » ?","Deux."],["Argumentation","Un texte argumentatif défend une thèse à l’aide d’arguments et d’exemples.","Thèse : lire est utile. Argument : la lecture enrichit le vocabulaire.","Distingue l’opinion défendue de sa justification.","Comment appelle-t-on l’idée défendue ?","La thèse."]],"Anglais":[["Prétérit","Le prétérit situe une action passée et terminée. Les verbes irréguliers changent souvent de forme.","Yesterday I went to school.","Repère le moment passé et choisis la forme verbale adaptée.","Prétérit de « go » ?","went."],["Comparatif","On compare avec -er than pour de nombreux adjectifs courts, ou more … than pour des adjectifs plus longs.","Tom is taller than Ben.","Vérifie la longueur de l’adjectif et les irrégularités.","Complète « bigger … »","than."],["Modaux","Can exprime une capacité ou une possibilité ; must une obligation forte ; should un conseil.","You should revise before a test.","Demande-toi si la phrase exprime une capacité, une obligation ou un conseil.","Quel modal sert souvent à donner un conseil ?","should."]],"Histoire-géo":[["Lumières","Au XVIIIe siècle, des penseurs des Lumières critiquent certains abus et défendent l’usage de la raison, la liberté et la diffusion des savoirs.","L’Encyclopédie cherche à rassembler et diffuser des connaissances.","Relie une idée à son contexte historique.","Quel grand ouvrage diffuse les savoirs au XVIIIe siècle ?","L’Encyclopédie."],["Révolution française","En 1789, la Révolution française remet en cause la monarchie absolue et l’ordre social d’Ancien Régime.","La Déclaration des droits de l’homme et du citoyen date de 1789.","Place les événements clés sur une frise.","En quelle année commence la Révolution française ?","1789."],["Urbanisation","L’urbanisation est l’augmentation de la population vivant en ville. Les espaces urbains s’étendent et se transforment.","L’étalement urbain correspond à l’extension de la ville vers sa périphérie.","Compare centre, banlieue et périphérie.","Comment appelle-t-on l’extension de la ville ?","L’étalement urbain."]],"SVT":[["Puberté","La puberté correspond à des transformations physiques et physiologiques progressives liées à la maturation de l’appareil reproducteur.","Le rythme de la puberté varie d’une personne à l’autre.","Distingue transformations communes et variations individuelles.","La puberté survient-elle au même âge pour tous ?","Non, l’âge varie."],["Microorganismes","Les microorganismes sont microscopiques. Certains sont utiles, d’autres peuvent provoquer des maladies ; l’hygiène limite certaines transmissions.","Le lavage des mains avec du savon réduit la transmission de nombreux microbes.","Distingue contamination et infection.","Cite un geste d’hygiène qui limite la transmission.","Se laver les mains."],["Tectonique","La surface terrestre est divisée en plaques lithosphériques en mouvement. Leurs limites sont souvent associées aux séismes et au volcanisme.","Des séismes fréquents se produisent aux limites de certaines plaques.","Observe la répartition mondiale des séismes.","Où se concentrent de nombreux séismes ?","Aux limites des plaques."]],"Physique-chimie":[["Atomes et molécules","La matière est constituée d’atomes ; une molécule est un assemblage d’atomes liés. Une formule chimique indique les atomes présents.","H₂O représente une molécule d’eau : deux atomes d’hydrogène et un d’oxygène.","Lis les indices dans la formule.","Combien d’atomes d’hydrogène dans H₂O ?","Deux."],["Vitesse","La vitesse moyenne se calcule en divisant la distance parcourue par la durée du trajet, avec des unités cohérentes.","120 km en 2 h → 60 km/h.","Note distance et temps avant de calculer.","90 km en 3 h : vitesse moyenne ?","30 km/h."],["Loi d’Ohm","Pour un conducteur ohmique, la tension U est proportionnelle à l’intensité I : U = R × I.","R = 10 Ω et I = 0,2 A donnent U = 2 V.","Repère les trois grandeurs et leurs unités.","R = 5 Ω, I = 2 A : U ?","10 V."]]},"3e":{"Mathématiques":[["Fonctions","Une fonction associe à une valeur d’entrée une valeur de sortie. On peut la représenter par une formule, un tableau ou une courbe.","Si f(x) = 2x + 1, alors f(3) = 7.","Remplace x par la valeur donnée, puis calcule.","Si f(x)=3x−2, calcule f(4).","10."],["Thalès","Dans une configuration de droites parallèles, le théorème de Thalès permet d’écrire des rapports de longueurs égaux.","Si les longueurs correspondantes sont 2 et 4 d’un côté, le rapport vaut 1/2.","Vérifie d’abord le parallélisme et les correspondances.","Si AB/AC = 1/2 et AC = 10 cm, AB vaut ?","5 cm."],["Probabilités","Une probabilité est comprise entre 0 et 1. Dans une situation équiprobable, elle vaut nombre de cas favorables divisé par nombre de cas possibles.","Dé équilibré : probabilité d’obtenir 6 = 1/6.","Liste les issues possibles puis celles qui conviennent.","Probabilité de tirer pile avec une pièce équilibrée ?","1/2."]],"Français":[["Analyser un texte","Pour comprendre un texte, identifie le narrateur, le point de vue, les champs lexicaux et les procédés d’écriture. Justifie tes réponses par des éléments précis.","Un champ lexical de la peur peut comprendre « trembler », « frisson », « angoisse ».","Lis la question, repère un indice, puis explique son effet.","Que faut-il ajouter pour justifier une interprétation ?","Un indice précis du texte."],["Figures de style","La comparaison rapproche deux éléments avec un outil comparatif ; la métaphore rapproche sans cet outil ; la personnification prête des traits humains à un élément non humain.","« Il est rapide comme l’éclair » : comparaison.","Cherche les mots « comme », « tel » et les images employées.","Figure de style dans « Le vent murmure » ?","Personnification."],["Rédaction et réécriture","Une rédaction organisée comporte introduction, développement et conclusion selon le sujet. La réécriture exige de respecter les accords et les temps.","Passer « il marche » au pluriel donne « ils marchent ».","Relis les consignes, puis vérifie les accords.","Réécris au pluriel : « Elle est heureuse. »","Elles sont heureuses."]],"Anglais":[["Present perfect","Le present perfect relie un événement passé à une situation présente : have/has + participe passé.","I have visited London twice.","Distingue un moment passé daté d’un bilan d’expérience.","Complète « She … finished »","has."],["Conditionnel","Le premier conditionnel exprime une conséquence possible : if + présent, will + base verbale.","If it rains, I will stay home.","Repère la condition et la conséquence.","Complète « If I study, I … pass »","will."],["Compréhension et expression","Dans un document anglais, repère qui, où, quand et l’idée principale avant de chercher les détails. Pour écrire, utilise des connecteurs simples.","First, I revise. Then, I practise. Finally, I rest.","Lis le titre, surligne les mots connus et reformule l’idée principale.","Que signifie « finally » ?","Enfin."]],"Histoire-géo":[["Première Guerre mondiale","De 1914 à 1918, la Première Guerre mondiale mobilise soldats et civils. Les combats de tranchées et la violence de masse marquent le conflit.","La bataille de Verdun se déroule en 1916.","Relie dates, lieux et conséquences humaines.","En quelle année se déroule Verdun ?","1916."],["Seconde Guerre mondiale","De 1939 à 1945, la Seconde Guerre mondiale est un conflit mondial marqué par des violences de masse et le génocide des Juifs d’Europe.","Le débarquement allié en Normandie a lieu le 6 juin 1944.","Distingue guerre, occupation, Résistance et génocide.","En quelle année a lieu le débarquement de Normandie ?","1944."],["Institutions et citoyenneté","La République française repose notamment sur la Constitution, les élections et la séparation des pouvoirs. Les citoyens disposent de droits et de devoirs.","Les députés votent les lois au Parlement avec les sénateurs.","Distingue pouvoirs exécutif, législatif et judiciaire.","Quelle institution vote les lois ?","Le Parlement."]],"SVT":[["Génétique","L’information génétique est portée par l’ADN, organisé en chromosomes. Les gènes contribuent à des caractères héréditaires.","Chez l’humain, les cellules somatiques possèdent habituellement 46 chromosomes.","Distingue ADN, gène et chromosome.","Quelle molécule porte l’information génétique ?","L’ADN."],["Immunité","Le système immunitaire protège l’organisme. Les globules blancs participent aux réponses immunitaires ; la vaccination prépare une réponse spécifique.","Après une vaccination, des cellules mémoire peuvent contribuer à une réponse plus rapide.","Distingue réaction immédiate et mémoire immunitaire.","Quel type de cellules participe à la défense immunitaire ?","Les globules blancs."],["Climat et environnement","L’effet de serre naturel rend la Terre habitable. L’augmentation des gaz à effet de serre due aux activités humaines accentue le réchauffement climatique.","Le dioxyde de carbone est un gaz à effet de serre.","Sépare météo à court terme et climat à long terme.","Cite un gaz à effet de serre.","Le dioxyde de carbone."]],"Physique-chimie":[["Énergie et puissance","L’énergie peut être transférée ou transformée. La puissance mesure le rythme du transfert d’énergie : P = E/t.","Un appareil de 100 W utilisé pendant 2 h consomme 200 Wh.","Vérifie les unités de temps et de puissance.","Une lampe de 50 W pendant 2 h consomme combien de Wh ?","100 Wh."],["Réactions chimiques","Lors d’une transformation chimique, les atomes se réorganisent ; le nombre d’atomes de chaque élément se conserve.","2 H₂ + O₂ → 2 H₂O conserve H et O.","Compte les atomes de chaque côté.","Dans une équation équilibrée, que conserve-t-on ?","Le nombre d’atomes de chaque élément."],["Mouvement et forces","Une force peut modifier le mouvement ou déformer un objet. Un mouvement se décrit par rapport à un référentiel.","Un freinage ralentit un vélo : les forces modifient sa vitesse.","Choisis le référentiel avant de décrire la trajectoire.","Une force peut-elle modifier la vitesse ?","Oui."]]}}, EXAM={"Français":[["Dans « Les enfants jouent », quel est le sujet ?",["Les enfants","jouent","enfants jouent","Les"],0,"Le groupe nominal « Les enfants » commande l’accord du verbe."],["Quel est le temps de « nous avions terminé » ?",["Imparfait","Plus-que-parfait","Passé simple","Futur antérieur"],1,"Auxiliaire à l’imparfait + participe passé : plus-que-parfait."],["« Un silence assourdissant » est un exemple de…",["Comparaison","Oxymore","Hyperbole numérique","Métonymie"],1,"Deux mots de sens opposés sont rapprochés."],["Dans « Il parle à sa sœur », « à sa sœur » est…",["COD","Sujet","COI","Attribut"],2,"Le complément du verbe est introduit par « à »."],["Quelle forme est correctement accordée ?",["Elles sont arrivé","Elles sont arrivées","Elles est arrivées","Elles sont arriver"],1,"Avec être, le participe passé s’accorde avec le sujet."],["Quelle phrase est à la voix passive ?",["Le chat poursuit la souris.","La souris est poursuivie par le chat.","Le chat court vite.","La souris s’enfuit."],1,"Le sujet subit l’action : être + participe passé."],["Dans « Le vent chantait », on trouve…",["Une comparaison","Une personnification","Une antithèse","Une litote"],1,"Le vent reçoit une action humaine : chanter."],["Quelle phrase comporte une proposition subordonnée relative ?",["Je lis et tu écris.","Je lis le livre que tu conseilles.","Je lis ce soir.","Lis ce livre !"],1,"« que tu conseilles » complète « livre »."]],"Mathématiques":[["3/4 de 20 vaut…",["10","12","15","18"],2,"20 ÷ 4 × 3 = 15."],["Résoudre 2x + 3 = 11 donne…",["x = 3","x = 4","x = 5","x = 7"],1,"2x = 8, donc x = 4."],["Si f(x) = 3x − 2, alors f(5) =…",["10","11","13","15"],2,"3 × 5 − 2 = 13."],["Triangle rectangle de côtés 6 cm et 8 cm : hypoténuse ?",["9 cm","10 cm","12 cm","14 cm"],1,"√(6² + 8²) = √100 = 10."],["Probabilité de tirer un as dans un jeu de 52 cartes ?",["1/4","1/13","1/52","4/13"],1,"4 as sur 52 cartes : 4/52 = 1/13."],["20 % de 150 vaut…",["20","25","30","35"],2,"0,20 × 150 = 30."],["Développer 3(x + 2) donne…",["3x + 2","3x + 6","x + 6","6x"],1,"La distributivité donne 3×x + 3×2."],["La moyenne de 8, 10 et 12 est…",["9","10","11","12"],1,"(8 + 10 + 12) ÷ 3 = 10."]],"Histoire-géo / EMC":[["Début de la Première Guerre mondiale ?",["1912","1914","1916","1918"],1,"La Première Guerre mondiale commence en 1914."],["Débarquement de Normandie ?",["1940","1942","1944","1945"],2,"Le 6 juin 1944 a lieu le débarquement allié."],["La Ve République est instaurée en…",["1945","1958","1968","1981"],1,"La Constitution de la Ve République date de 1958."],["Quel organe vote les lois en France ?",["Le Parlement","Le Conseil d’État","La préfecture","La mairie"],0,"Le Parlement comprend l’Assemblée nationale et le Sénat."],["Une métropole est…",["Une zone sans habitants","Une grande ville concentrant des fonctions","Un espace uniquement agricole","Une frontière"],1,"Elle concentre habitants, activités et services."],["Quel océan borde la côte ouest de la France métropolitaine ?",["Pacifique","Indien","Atlantique","Arctique"],2,"La façade occidentale donne sur l’océan Atlantique."],["Quel texte de 1789 affirme des droits fondamentaux ?",["Code civil","Déclaration des droits de l’homme et du citoyen","Traité de Rome","Charte de l’ONU"],1,"La Déclaration est adoptée en août 1789."],["Quel terme désigne le fait de choisir ses représentants par le vote ?",["Élection","Censure","Décret","Recensement"],0,"Une élection désigne le choix de représentants par le vote."]],"Sciences – SVT":[["Quelle molécule porte l’information génétique ?",["Glucose","ADN","Eau","Dioxygène"],1,"L’ADN porte l’information génétique."],["Les chromosomes se trouvent principalement dans…",["Le noyau","La membrane","Le cytoplasme seul","La paroi"],0,"Dans une cellule humaine, les chromosomes sont dans le noyau."],["Quel organe assure les échanges gazeux chez l’humain ?",["Foie","Poumons","Estomac","Reins"],1,"Les poumons assurent les échanges de gaz avec le sang."],["La vaccination vise principalement à…",["Remplacer le sommeil","Préparer une réponse immunitaire","Éliminer tous les microbes","Augmenter la température"],1,"Elle entraîne une mémoire immunitaire spécifique."],["Les plaques lithosphériques…",["Sont immobiles","Se déplacent lentement","Sont uniquement océaniques","N’existent pas"],1,"Leur mouvement explique une partie de l’activité tectonique."],["Quel gaz est un gaz à effet de serre ?",["Dioxyde de carbone","Dioxygène","Diazote","Argon"],0,"Le CO₂ contribue à l’effet de serre."],["L’absorption des nutriments a lieu surtout dans…",["L’œsophage","L’intestin grêle","La bouche","Le gros intestin"],1,"L’intestin grêle absorbe une grande partie des nutriments."],["Le pollen peut être transporté par…",["Des insectes","Des roches","Des métaux","Des aimants"],0,"De nombreux insectes transportent du pollen entre fleurs."]],"Sciences – Physique-chimie":[["Formule de la vitesse moyenne ?",["Distance × temps","Distance ÷ temps","Temps ÷ distance","Distance + temps"],1,"v = d/t avec des unités cohérentes."],["Dans H₂O, combien d’atomes d’hydrogène ?",["1","2","3","4"],1,"L’indice 2 indique deux atomes d’hydrogène."],["L’unité de la tension électrique est…",["Ampère","Ohm","Volt","Watt"],2,"La tension se mesure en volts."],["Un objet de masse 2 kg a une masse de…",["20 g","200 g","2 000 g","20 000 g"],2,"1 kg = 1 000 g."],["Une transformation chimique conserve…",["Le nombre d’atomes de chaque élément","Toujours la couleur","Toujours la température","Toujours le volume"],0,"Les atomes sont réarrangés mais conservés."],["Une lampe de 100 W pendant 2 h consomme…",["50 Wh","100 Wh","200 Wh","500 Wh"],2,"Énergie = puissance × durée = 200 Wh."],["Un circuit électrique ouvert…",["Permet toujours le courant","Interrompt le courant","Double la tension","Supprime le générateur"],1,"Une boucle interrompue empêche la circulation du courant."],["Une ombre apparaît lorsqu’un objet…",["Transparent laisse tout passer","Opaque bloque la lumière","Émet de la lumière","Est forcément chaud"],1,"Un objet opaque intercepte la lumière."]]};
const grades=Object.keys(COURSES), subjects=Object.keys(COURSES['6e']);
let grade='6e',subject='Mathématiques',tab='cours',lessonIdx=0,lessonMode='manuel';
let quiz=null, exam=null, examTick=null;
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function safeGet(k,def){try{return JSON.parse(localStorage.getItem(k))??def}catch{return def}}
function safeSet(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}
function setup(){ $('grade').innerHTML=grades.map(g=>`<option>${g}</option>`).join('');$('subject').innerHTML=subjects.map(s=>`<option>${s}</option>`).join('');$('grade').onchange=e=>{grade=e.target.value;lessonIdx=0;render()};$('subject').onchange=e=>{subject=e.target.value;lessonIdx=0;render()};document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});render()}
function render(){document.querySelectorAll('[data-tab]').forEach(b=>b.className=b.dataset.tab===tab?'selected':'light');$('selectors').style.display=tab==='brevet'?'none':'block';$('grade').value=grade;$('subject').value=subject;$('content').innerHTML=''; if(tab==='cours')renderCourses();if(tab==='quiz')renderQuiz();if(tab==='brevet')renderExam();if(tab==='progres')renderProgress()}
function renderCourses(){const a=COURSES[grade][subject];let h=`<div class="card"><h2>📚 Cours — ${esc(grade)} · ${esc(subject)}</h2><p class="muted">${a.length} chapitres de démarrage. Deux explications par chapitre, exercice corrigé et fiche à retenir.</p>${a.map((l,i)=>`<button class="coursebtn" onclick="chooseLesson(${i})">Chapitre ${i+1} — ${esc(l[0])} ${i===lessonIdx?'✓':''}</button>`).join('')}</div>`;const l=a[lessonIdx];h+=`<div class="card"><h2>${esc(l[0])}</h2><div class="row"><button class="${lessonMode==='manuel'?'selected':'light'}" onclick="setLessonMode('manuel')">📖 Manuel détaillé</button><button class="${lessonMode==='prof'?'selected':'light'}" onclick="setLessonMode('prof')">👩‍🏫 Professeur</button></div>`;
if(lessonMode==='manuel')h+=`<div class="lesson"><h3>Leçon et définition</h3><p>${esc(l[1])}</p><h3>Exemple corrigé</h3><p>${esc(l[2])}</p></div>`;else h+=`<div class="lesson"><h3>On apprend ensemble</h3><p>Lis l’idée principale : ${esc(l[1])}</p><p><strong>Voici un exemple :</strong> ${esc(l[2])}</p><p><strong>Ma méthode :</strong> ${esc(l[3])}</p></div>`;
h+=`<h3>✏️ À toi de jouer</h3><p>${esc(l[4])}</p><button class="light" onclick="document.getElementById('courseAnswer').classList.toggle('hidden')">Afficher / masquer la correction</button><div id="courseAnswer" class="notice hidden">${esc(l[5])}</div><div class="notice"><strong>Fiche de révision :</strong> ${esc(l[1])}</div><button onclick="completeLesson()">✓ Marquer ce chapitre comme étudié</button></div>`;$('content').innerHTML=h}
function chooseLesson(i){lessonIdx=i;render()}function setLessonMode(m){lessonMode=m;render()}
function completeLesson(){let k='devoirs_v3_lessons',p=safeGet(k,{});p[grade+'|'+subject+'|'+lessonIdx]=true;safeSet(k,p);alert('Chapitre marqué comme étudié !')}
function buildQuiz(){const pool=COURSES[grade][subject],qs=[];const diff=$('difficulty').value;for(let i=0;i<10;i++){let l=pool[i%pool.length];let variants=[l[4],`Rappelle la règle essentielle du chapitre « ${l[0]} ».`,`Explique l’exemple suivant : ${l[2]}`,`Quelle méthode utiliserais-tu pour le chapitre « ${l[0]} » ?`];let ans=[l[5],l[1],l[2],l[3]];let n=(i+({facile:0,moyen:1,difficile:2}[diff]))%4;qs.push({q:variants[n],answer:ans[n],chapter:l[0]})}quiz={qs,index:0,correct:0,diff,grade,subject};renderQuiz()}
function renderQuiz(){let h=`<div class="card"><h2>🧠 Quiz et entraînement</h2><p>10 questions ouvertes, avec correction expliquée. Évalue ta réponse toi-même après l’avoir comparée au corrigé.</p><label>Difficulté</label><select id="difficulty"><option value="facile">Facile</option><option value="moyen">Moyen</option><option value="difficile">Difficile</option></select><button style="margin-top:12px" onclick="buildQuiz()">Nouveau quiz de 10 questions</button></div>`;if(quiz&&quiz.grade===grade&&quiz.subject===subject){if(quiz.index>=10){h+=`<div class="card"><h2>Résultat : ${quiz.correct}/10</h2><p>Bravo pour ton entraînement ! Relis les cours si besoin.</p></div>`}else{let q=quiz.qs[quiz.index];h+=`<div class="card"><p class="pill">Question ${quiz.index+1}/10</p><div class="bar"><div style="width:${quiz.index*10}%"></div></div><h3>${esc(q.chapter)}</h3><p class="qtitle">${esc(q.q)}</p><textarea id="freeAnswer" placeholder="Écris ta réponse (facultatif)" style="width:100%;min-height:90px;border:1px solid #ddd3f4;border-radius:10px;padding:10px;font:inherit"></textarea><p><button class="light" onclick="document.getElementById('quizCorrection').classList.remove('hidden')">Voir la correction</button></p><div id="quizCorrection" class="hidden notice"><strong>Correction :</strong> ${esc(q.answer)}<p>Ta réponse correspond-elle au corrigé ?</p><div class="row"><button onclick="markQuiz(true)">✓ Oui</button><button class="light" onclick="markQuiz(false)">À revoir</button></div></div></div>`}}$('content').innerHTML=h;if($('difficulty'))$('difficulty').value=quiz?.diff||'facile'}
function markQuiz(ok){if(!quiz||quiz.index>=10)return;if(ok)quiz.correct++;quiz.index++;if(quiz.index===10){let history=safeGet('devoirs_v3_scores',[]);history.unshift({date:new Date().toLocaleDateString('fr-FR'),grade:quiz.grade,subject:quiz.subject,score:quiz.correct});safeSet('devoirs_v3_scores',history.slice(0,30))}renderQuiz()}
function renderProgress(){let l=safeGet('devoirs_v3_lessons',{}),scores=safeGet('devoirs_v3_scores',[]),exams=safeGet('devoirs_v3_exams',[]);$('content').innerHTML=`<div class="card"><h2>📈 Mes progrès (sur cet appareil)</h2><p>Chapitres étudiés : <strong>${Object.keys(l).length}</strong> / 72</p><h3>Quiz récents</h3>${scores.length?scores.slice(0,10).map(x=>`<p>${esc(x.date)} — ${esc(x.grade)} ${esc(x.subject)} : <strong>${x.score}/10</strong></p>`).join(''):'<p>Aucun quiz terminé.</p>'}<h3>Brevets blancs</h3>${exams.length?exams.slice(0,5).map(x=>`<p>${esc(x.date)} — <strong>${x.score}/40</strong> (${Math.round(x.score/40*20)}/20)</p>`).join(''):'<p>Aucun brevet blanc terminé.</p>'}<p class="muted">Données enregistrées localement dans ce navigateur, sans compte. Elles peuvent disparaître si les données du navigateur sont effacées.</p></div>`}
function startExam(){if(exam&&exam.running&&!confirm('Recommencer effacera les réponses de cet examen. Continuer ?'))return;let items=Object.entries(EXAM).flatMap(([section,arr])=>arr.map(q=>({section,q:q[0],options:q[1],correct:q[2],explanation:q[3]})));exam={items,answers:{},started:Date.now(),end:Date.now()+4*60*60*1000,running:true,submitted:false,index:0};saveExam();startTimer();renderExam()}
function saveExam(){safeSet('devoirs_v3_exam_state',exam)}
function startTimer(){if(examTick)clearInterval(examTick);examTick=setInterval(()=>{if(!exam||!exam.running)return;if(Date.now()>=exam.end){finishExam(true);return}let t=$('timeleft');if(t)t.textContent=formatTime(exam.end-Date.now())},1000)}
function formatTime(ms){let s=Math.max(0,Math.floor(ms/1000));return [Math.floor(s/3600),Math.floor(s%3600/60),s%60].map(n=>String(n).padStart(2,'0')).join(':')}
function answerExam(i){if(!exam||!exam.running)return;exam.answers[exam.index]=i;saveExam();renderExam()}
function examMove(d){exam.index=Math.max(0,Math.min(exam.items.length-1,exam.index+d));saveExam();renderExam()}
function finishExam(auto=false){if(!exam||!exam.running)return;if(!auto&&!confirm('Terminer le brevet blanc et afficher la correction ?'))return;exam.running=false;exam.submitted=true;exam.finished=Date.now();let score=exam.items.reduce((n,q,i)=>n+(exam.answers[i]===q.correct?1:0),0);exam.score=score;let history=safeGet('devoirs_v3_exams',[]);history.unshift({date:new Date().toLocaleDateString('fr-FR'),score});safeSet('devoirs_v3_exams',history.slice(0,15));saveExam();if(examTick)clearInterval(examTick);renderExam()}
function renderExam(){if(!exam){exam=safeGet('devoirs_v3_exam_state',null);if(exam&&exam.running){if(Date.now()>=exam.end){finishExam(true);return}startTimer()}}let h=`<div class="card"><h2>🏅 Brevet blanc de 3e</h2><div class="notice"><strong>Examen blanc d’entraînement original, format simplifié :</strong> 40 QCM (8 par épreuve), 4 h au total. Ce n’est pas une reproduction complète des épreuves officielles du DNB : il n’inclut ni rédaction longue, ni dictée, ni oral, ni documents à analyser. Le score /20 est indicatif et non officiel.</div><p>Français · Mathématiques · Histoire-géo/EMC · SVT · Physique-chimie</p></div>`;
if(!exam||exam.submitted){if(exam?.submitted){h+=`<div class="card"><h2>Résultat : ${exam.score}/40 — ${Math.round(exam.score/2)}/20</h2><p>Correction détaillée :</p>${exam.items.map((q,i)=>`<div class="lesson"><strong>${i+1}. ${esc(q.q)}</strong><p>Ta réponse : ${exam.answers[i]===undefined?'Non répondue':esc(q.options[exam.answers[i]])}</p><p>Bonne réponse : <strong>${esc(q.options[q.correct])}</strong></p><p>${esc(q.explanation)}</p></div>`).join('')}</div>`}h+=`<div class="card"><button onclick="startExam()">${exam?.submitted?'Recommencer un brevet blanc':'Commencer le brevet blanc chronométré'}</button></div>`}else{let q=exam.items[exam.index],answered=Object.keys(exam.answers).length;h+=`<div class="card"><div class="row"><span class="pill">Question ${exam.index+1}/40</span><span class="timer" id="timeleft">${formatTime(exam.end-Date.now())}</span></div><p class="muted">${answered}/40 réponses enregistrées · ${esc(q.section)}</p><div class="bar"><div style="width:${answered/40*100}%"></div></div><h3>${esc(q.q)}</h3><div class="answers">${q.options.map((o,i)=>`<button class="${exam.answers[exam.index]===i?'chosen':''}" onclick="answerExam(${i})">${String.fromCharCode(65+i)}. ${esc(o)}</button>`).join('')}</div><div class="row"><button class="light" onclick="examMove(-1)" ${exam.index===0?'disabled':''}>Précédente</button><button onclick="examMove(1)" ${exam.index===39?'disabled':''}>Suivante</button></div><p><button class="light" onclick="finishExam()">Terminer et corriger</button></p><p class="muted">Les réponses sont sauvegardées localement. Le chronomètre continue si tu quittes la page.</p></div>`} $('content').innerHTML=h}
window.addEventListener('DOMContentLoaded',setup);
</script><style>.program-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px}.program-chip{padding:10px;background:#f1edfc;border-radius:10px;color:#30235c}.course-detail{border-left:4px solid #6955c7;padding:10px 14px;background:#faf8ff;margin:12px 0}.program-note{background:#fff4df;padding:12px;border-radius:12px}</style>

const FULL={"6e|Mathématiques|Fractions et partage": {"goal": "Comprendre ce que signifie une fraction et représenter un partage égal.", "manual": "Une fraction a/b désigne a parts lorsque l’unité est partagée en b parts égales (b différent de zéro). Le nombre du haut est le numérateur ; celui du bas est le dénominateur. Par exemple 3/4 représente trois parts sur quatre. Deux fractions peuvent désigner la même quantité : 1/2 = 2/4.", "teacher": "Imagine une pizza coupée en 4 parts identiques. Si tu en manges 3, tu as mangé 3/4 de la pizza. Attention : les parts doivent avoir la même taille.", "example": "Pour trouver 3/4 de 20 : 20 ÷ 4 = 5, puis 5 × 3 = 15.", "exercise": "Calcule 2/5 de 30.", "answer": "30 ÷ 5 = 6 ; 6 × 2 = 12."}, "6e|Mathématiques|Périmètres et aires": {"goal": "Distinguer la longueur du contour et la surface.", "manual": "Le périmètre est la longueur du contour d’une figure : il s’exprime en unités de longueur. L’aire mesure la surface : elle s’exprime en unités carrées. Pour un rectangle de longueur L et largeur l, P = 2 × (L + l) et A = L × l.", "teacher": "Pour poser une clôture autour d’un jardin, tu calcules le périmètre. Pour acheter du gazon, tu calcules l’aire.", "example": "Rectangle 8 m × 3 m : périmètre 22 m ; aire 24 m².", "exercise": "Un rectangle mesure 7 cm par 4 cm. Trouve P et A.", "answer": "P = 2 × (7 + 4) = 22 cm ; A = 7 × 4 = 28 cm²."}, "5e|Mathématiques|Nombres relatifs": {"goal": "Lire, comparer et additionner des nombres positifs et négatifs.", "manual": "Un nombre relatif peut être positif, nul ou négatif. Sur une droite graduée, le nombre le plus à droite est le plus grand. Pour additionner deux nombres de signes différents, on soustrait les distances à zéro et on garde le signe de celui qui a la plus grande distance à zéro.", "teacher": "La température passe de −3 °C à +2 °C : elle augmente de 5 °C. Pour calculer −3 + 5, tu avances de 5 unités depuis −3.", "example": "−7 + 4 = −3 ; −2 + 8 = 6.", "exercise": "Calcule −9 + 12.", "answer": "12 − 9 = 3, donc −9 + 12 = 3."}, "4e|Mathématiques|Théorème de Pythagore": {"goal": "Calculer une longueur dans un triangle rectangle.", "manual": "Dans un triangle rectangle, le carré de la longueur de l’hypoténuse est égal à la somme des carrés des longueurs des deux autres côtés. Si ABC est rectangle en A, BC² = AB² + AC². La réciproque permet de démontrer qu’un triangle est rectangle.", "teacher": "Repère d’abord l’angle droit. Le côté en face, le plus long, s’appelle l’hypoténuse. Ensuite seulement, écris la formule.", "example": "Côtés de l’angle droit : 3 cm et 4 cm. Hypoténuse = √(3² + 4²) = 5 cm.", "exercise": "Triangle rectangle de côtés 5 cm et 12 cm : hypoténuse ?", "answer": "√(25 + 144) = √169 = 13 cm."}, "3e|Mathématiques|Fonctions linéaires et affines": {"goal": "Reconnaître et utiliser une fonction affine.", "manual": "Une fonction affine est de la forme f(x) = ax + b. Sa représentation graphique est une droite. Si b = 0, la fonction est linéaire. Le coefficient a indique la variation de f(x) quand x augmente de 1 ; b est l’ordonnée à l’origine.", "teacher": "Un taxi facture 4 € de prise en charge puis 2 € par kilomètre. Le prix pour x kilomètres est f(x) = 2x + 4.", "example": "Pour 6 km : f(6) = 2 × 6 + 4 = 16 €.", "exercise": "Avec f(x) = 3x − 2, calcule f(5).", "answer": "f(5) = 3 × 5 − 2 = 13."}, "3e|Mathématiques|Trigonométrie": {"goal": "Utiliser sinus, cosinus et tangente dans un triangle rectangle.", "manual": "Dans un triangle rectangle et pour un angle aigu, cosinus = adjacent/hypoténuse, sinus = opposé/hypoténuse, tangente = opposé/adjacent. Il faut identifier l’angle étudié et les côtés correspondants.", "teacher": "Trace un triangle rectangle, entoure l’angle demandé puis repère le côté opposé, le côté adjacent et l’hypoténuse avant de choisir la formule.", "example": "Si adjacent = 4 et hypoténuse = 5, cosinus de l’angle = 4/5 = 0,8.", "exercise": "Si opposé = 3 et hypoténuse = 5, calcule le sinus.", "answer": "sinus = 3/5 = 0,6."}, "6e|Histoire|La longue histoire de l’humanité et des migrations": {"goal": "Comprendre les grandes étapes de la préhistoire et les migrations humaines.", "manual": "Les premiers humains apparaissent en Afrique. Sur une très longue durée, des groupes humains migrent et peuplent progressivement différents continents. La maîtrise du feu, l’évolution des outils et, plus tard, la domestication des plantes et des animaux transforment les modes de vie. Les historiens et archéologues utilisent des vestiges pour étudier ces périodes.", "teacher": "Imagine des groupes qui se déplacent pour trouver de la nourriture et de l’eau. On retrouve leurs traces grâce aux outils, ossements et habitats découverts par les archéologues.", "example": "Le passage à l’agriculture et à l’élevage favorise la sédentarisation de certaines populations.", "exercise": "Cite deux types de traces étudiées par les archéologues.", "answer": "Par exemple des outils en pierre et des ossements."}, "3e|Histoire|L’Europe, un théâtre majeur des guerres totales (1914–1945)": {"goal": "Situer les deux guerres mondiales et comprendre la notion de guerre totale.", "manual": "La Première Guerre mondiale (1914-1918) mobilise soldats, économies et populations civiles. L’entre-deux-guerres voit l’affirmation de régimes totalitaires. La Seconde Guerre mondiale (1939-1945) est marquée par une violence extrême contre les combattants et les civils, ainsi que par le génocide des Juifs d’Europe et des Tsiganes perpétré par les nazis et leurs collaborateurs.", "teacher": "Une guerre totale touche toute la société : les soldats au front, les usines, les familles, les villes et les ressources du pays. Il faut aussi distinguer les causes, les étapes et les conséquences de chaque conflit.", "example": "1914-1918 : Première Guerre mondiale. 1939-1945 : Seconde Guerre mondiale.", "exercise": "Pourquoi parle-t-on de guerre totale ?", "answer": "Parce que la guerre mobilise les forces militaires, économiques et humaines des sociétés, y compris les civils."}, "3e|Français|Rédaction argumentative": {"goal": "Construire une argumentation organisée.", "manual": "Une argumentation présente une thèse (l’idée défendue), des arguments (raisons) et des exemples précis. On organise le texte en introduction, développement et conclusion. Des connecteurs comme « d’abord », « ensuite », « cependant » et « enfin » rendent le raisonnement clair.", "teacher": "Tu veux convaincre ton collège de créer un jardin ? Dis ton idée, donne deux raisons, illustre chacune par un exemple, puis termine en rappelant ta proposition.", "example": "Thèse : un jardin scolaire est utile. Argument : il permet de comprendre la biodiversité. Exemple : les élèves observent les pollinisateurs.", "exercise": "Rédige un argument et un exemple pour défendre la lecture quotidienne.", "answer": "Exemple possible : la lecture enrichit le vocabulaire ; en lisant régulièrement, on découvre de nouveaux mots dans leur contexte."}, "6e|Français|Le groupe nominal": {"goal": "Identifier le nom noyau et les éléments qui le précisent.", "manual": "Un groupe nominal (GN) est construit autour d’un nom noyau. Il peut comprendre un déterminant et des expansions du nom : adjectif, complément du nom ou proposition relative. Les accords se font notamment en genre et en nombre.", "teacher": "Dans « les petits chats noirs », le mot principal est « chats ». « les » est le déterminant ; « petits » et « noirs » donnent des précisions.", "example": "« Une maison ancienne » : déterminant « une », nom « maison », adjectif « ancienne ».", "exercise": "Trouve le nom noyau dans « les grandes fenêtres du salon ».", "answer": "Le nom noyau est « fenêtres »."}};
Object.assign(FULL,{"6e|Mathématiques|Nombres entiers et décimaux":{"goal":"Lire et écrire les nombres","manual":"Dans 4 205,37, le chiffre 4 représente les milliers, 2 les centaines, 5 les unités, 3 les dixièmes et 7 les centièmes. La virgule sépare partie entière et partie décimale.","teacher":"Un nombre décimal fonctionne comme un tableau de positions : chaque colonne vaut dix fois celle à sa droite.","example":"12,45 = 12 + 4/10 + 5/100.","exercise":"Quelle est la valeur du 6 dans 23,67 ?","answer":"Il représente 6 dixièmes, soit 0,6."},"6e|Mathématiques|Les quatre opérations":{"goal":"Choisir et poser une opération","manual":"Additionner réunit des quantités, soustraire mesure un écart, multiplier additionne des groupes égaux, diviser partage ou cherche combien de fois une quantité entre dans une autre. On vérifie la cohérence par un ordre de grandeur.","teacher":"Pour 4 paquets de 6 biscuits, multiplie 4 par 6. Pour répartir 24 biscuits entre 4 amis, divise 24 par 4.","example":"36 ÷ 4 = 9 et 9 × 4 = 36.","exercise":"Un cahier coûte 3 €. Combien coûtent 7 cahiers ?","answer":"7 × 3 = 21 €."},"6e|Mathématiques|Comparer et ranger des nombres":{"goal":"Comparer les décimaux","manual":"On compare d’abord les parties entières, puis les dixièmes, centièmes et millièmes. Ajouter des zéros à droite de la partie décimale ne change pas la valeur.","teacher":"Écris 3,5 comme 3,50 pour le comparer à 3,47 : 3,50 est plus grand.","example":"2,08 < 2,8 car 2,08 < 2,80.","exercise":"Range 4,7 ; 4,09 ; 4,71 du plus petit au plus grand.","answer":"4,09 < 4,7 < 4,71."},"6e|Mathématiques|Multiples et diviseurs":{"goal":"Reconnaître un multiple","manual":"Un nombre a est multiple de b lorsqu’il existe un entier k tel que a=b×k. Un diviseur partage un entier sans reste. Les multiples de 3 ont une somme des chiffres divisible par 3.","teacher":"24 est dans la table de 6 : 6×4=24. Donc 6 est un diviseur de 24.","example":"18 est multiple de 2, 3, 6 et 9.","exercise":"30 est-il multiple de 5 et de 3 ?","answer":"Oui : il finit par 0 et 3+0=3."},"6e|Mathématiques|Proportionnalité et pourcentages simples":{"goal":"Identifier une situation proportionnelle","manual":"Deux grandeurs sont proportionnelles lorsque l’on passe de l’une à l’autre en multipliant toujours par un même nombre, appelé coefficient de proportionnalité. Un pourcentage est une proportion sur 100.","teacher":"Si 1 kg de pommes coûte 3 €, 2 kg coûtent 6 € et 4 kg 12 €. Le prix est proportionnel à la masse.","example":"10 % de 50 = 50 × 10/100 = 5.","exercise":"Si 2 billets coûtent 8 €, combien coûtent 5 billets au même tarif ?","answer":"Un billet coûte 4 €, donc 5 billets coûtent 20 €."},"5e|Mathématiques|Fractions : opérations":{"goal":"Additionner des fractions","manual":"Pour additionner ou soustraire des fractions, on les écrit avec un dénominateur commun, puis on opère sur les numérateurs. Pour multiplier deux fractions, on multiplie numérateurs et dénominateurs.","teacher":"Les quarts ne s’additionnent directement qu’avec d’autres quarts : 1/4 + 2/4 = 3/4.","example":"1/2 + 1/4 = 2/4 + 1/4 = 3/4.","exercise":"Calcule 2/3 + 1/6.","answer":"4/6 + 1/6 = 5/6."},"5e|Mathématiques|Priorités opératoires":{"goal":"Respecter les priorités","manual":"Dans un calcul, on effectue d’abord les parenthèses, puis multiplications et divisions, puis additions et soustractions, de gauche à droite pour les opérations de même priorité.","teacher":"Dans 2 + 3 × 4, fais d’abord 3 × 4 : le résultat est 14, pas 20.","example":"(2 + 3) × 4 = 20, tandis que 2 + 3 × 4 = 14.","exercise":"Calcule 18 − 2 × (3 + 4).","answer":"18 − 2 × 7 = 18 − 14 = 4."},"5e|Mathématiques|Calcul littéral : initiation":{"goal":"Utiliser une lettre","manual":"Une lettre peut représenter un nombre inconnu ou variable. L’écriture 3x signifie 3 × x. On peut réduire les termes semblables : 2x + 5x = 7x.","teacher":"Si un ticket coûte x euros, trois tickets coûtent 3x euros.","example":"Pour x=4, 2x+3=2×4+3=11.","exercise":"Réduis 4a + 3a puis calcule pour a=2.","answer":"7a ; pour a=2, on obtient 14."},"5e|Mathématiques|Statistiques":{"goal":"Lire et calculer une moyenne","manual":"La moyenne d’une série numérique est la somme des valeurs divisée par le nombre de valeurs. Une fréquence indique la part d’un effectif dans le total. Une médiane sépare une série ordonnée en deux groupes.","teacher":"Pour trois notes, additionne-les puis divise par trois.","example":"Moyenne de 10, 12 et 14 : (10+12+14)/3 = 12.","exercise":"Quelle est la moyenne de 8, 10, 12 et 14 ?","answer":"(8+10+12+14)/4 = 11."},"5e|Mathématiques|Probabilités":{"goal":"Comprendre le hasard","manual":"Une expérience aléatoire peut produire plusieurs résultats sans que l’on sache lequel arrivera. Pour des issues équiprobables, la probabilité d’un événement vaut nombre d’issues favorables / nombre total d’issues.","teacher":"Sur un dé équilibré, chaque face a une chance sur six de sortir.","example":"Obtenir un nombre pair sur un dé : 3 issues sur 6, soit 1/2.","exercise":"Quelle est la probabilité de tirer pile avec une pièce équilibrée ?","answer":"1/2, soit 50 %."},"4e|Mathématiques|Calcul littéral et distributivité":{"goal":"Développer une expression","manual":"La distributivité permet d’écrire a(b+c)=ab+ac et a(b−c)=ab−ac. Développer supprime les parenthèses ; factoriser fait l’opération inverse.","teacher":"Imagine 3 sachets contenant chacun x billes et 2 jetons : 3(x+2)=3x+6.","example":"5(2x−1)=10x−5.","exercise":"Développe 4(x+3).","answer":"4x+12."},"4e|Mathématiques|Équations du premier degré":{"goal":"Résoudre une équation","manual":"Résoudre une équation consiste à trouver la valeur de l’inconnue qui rend l’égalité vraie. On conserve l’égalité en effectuant la même opération sur les deux membres.","teacher":"Une balance reste équilibrée si tu enlèves la même masse des deux côtés.","example":"3x+2=14 ; 3x=12 ; x=4. Vérification : 3×4+2=14.","exercise":"Résous 5x−3=17.","answer":"5x=20 donc x=4."},"4e|Mathématiques|Théorème de Pythagore":{"goal":"Calculer une longueur dans un triangle rectangle","manual":"Dans un triangle rectangle, le carré de l’hypoténuse est égal à la somme des carrés des deux autres côtés : c²=a²+b². Il faut identifier l’angle droit avant d’appliquer le théorème.","teacher":"L’hypoténuse est le côté en face de l’angle droit : c’est toujours le plus long.","example":"Côtés de l’angle droit 3 cm et 4 cm : c²=9+16=25, donc c=5 cm.","exercise":"Dans un triangle rectangle, les côtés de l’angle droit mesurent 6 et 8 cm. Trouve l’hypoténuse.","answer":"c²=36+64=100 donc c=10 cm."},"4e|Mathématiques|Fractions et puissances":{"goal":"Utiliser les puissances","manual":"Une puissance aⁿ représente un produit de n facteurs égaux à a pour n entier positif. Pour des puissances de même base, aᵐ×aⁿ=aᵐ⁺ⁿ. Les puissances de 10 servent à écrire de très grands ou petits nombres.","teacher":"10³, c’est 10×10×10 : mille.","example":"2⁴=16 et 10⁻²=0,01.","exercise":"Calcule 3³ et 10⁴.","answer":"3³=27 et 10⁴=10 000."},"3e|Mathématiques|Arithmétique et nombres premiers":{"goal":"Décomposer en facteurs premiers","manual":"Un nombre premier est un entier supérieur à 1 qui possède exactement deux diviseurs positifs : 1 et lui-même. Décomposer un entier en facteurs premiers facilite la recherche de diviseurs et de fractions irréductibles.","teacher":"Le nombre 12 n’est pas premier : 12=2×2×3. Le nombre 13 est premier.","example":"60=2²×3×5.","exercise":"Décompose 84 en facteurs premiers.","answer":"84=2²×3×7."},"3e|Mathématiques|Fonctions linéaires et affines":{"goal":"Lire une fonction affine","manual":"Une fonction affine s’écrit f(x)=ax+b. Sa représentation graphique est une droite. Si b=0, la fonction est linéaire. Le coefficient a indique la variation de f(x) quand x augmente de 1.","teacher":"Un taxi coûte 4 € au départ puis 2 € par kilomètre : f(x)=2x+4.","example":"Pour f(x)=3x−2, f(5)=15−2=13.","exercise":"Pour f(x)=2x+7, calcule f(4).","answer":"f(4)=2×4+7=15."},"3e|Mathématiques|Trigonométrie":{"goal":"Calculer dans un triangle rectangle","manual":"Dans un triangle rectangle, pour un angle aigu θ : cos θ = adjacent/hypoténuse, sin θ = opposé/hypoténuse et tan θ = opposé/adjacent. Le choix dépend des côtés connus.","teacher":"Repère d’abord l’angle étudié, puis nomme les côtés par rapport à lui.","example":"Si opposé=3 et hypoténuse=5, sin θ=3/5=0,6.","exercise":"Dans un triangle rectangle, adjacent=4 et hypoténuse=5. Quel est le cosinus de l’angle ?","answer":"cos θ=4/5=0,8."},"3e|Mathématiques|Puissances et notation scientifique":{"goal":"Écrire un nombre en notation scientifique","manual":"La notation scientifique est a×10ⁿ avec 1≤|a|<10 et n entier. Elle permet de comparer et calculer avec des grandeurs très grandes ou très petites.","teacher":"Pour 45 000, déplace la virgule de quatre rangs vers la gauche : 4,5×10⁴.","example":"0,00032=3,2×10⁻⁴.","exercise":"Écris 7 800 000 en notation scientifique.","answer":"7,8×10⁶."},"6e|Français|Nature et fonction des mots":{"goal":"Distinguer classe grammaticale et fonction","manual":"La nature indique ce qu’est un mot (nom, verbe, adjectif, pronom…). La fonction indique son rôle dans la phrase (sujet, complément d’objet, complément circonstanciel…). Un même nom peut avoir différentes fonctions.","teacher":"La nature, c’est l’identité du mot ; la fonction, c’est son métier dans la phrase.","example":"Dans « Le chat dort », « chat » est un nom commun et appartient au groupe sujet.","exercise":"Quelle est la nature du mot « rapidement » dans « Il court rapidement » ?","answer":"C’est un adverbe."},"6e|Français|Le verbe et ses temps":{"goal":"Reconnaître les temps simples","manual":"Le présent situe une action au moment où l’on parle ou exprime une habitude. L’imparfait décrit souvent une situation passée ou une habitude. Le futur simple situe une action à venir. On identifie le radical et les terminaisons.","teacher":"Hier je jouais, aujourd’hui je joue, demain je jouerai.","example":"« Nous chantions » est à l’imparfait ; « nous chanterons » au futur.","exercise":"Conjugue « finir » avec « nous » au futur simple.","answer":"Nous finirons."},"6e|Français|Accords dans la phrase":{"goal":"Accorder sujet et verbe","manual":"Le verbe s’accorde en personne et en nombre avec son sujet. Dans un groupe nominal, déterminant, nom et adjectif s’accordent généralement en genre et en nombre.","teacher":"Cherche d’abord qui fait l’action, puis choisis la bonne terminaison.","example":"« Les enfants jouent » : sujet pluriel, verbe pluriel.","exercise":"Complète : « Les petites filles (chanter) ».","answer":"Les petites filles chantent."},"5e|Français|Temps du récit":{"goal":"Distinguer imparfait et passé simple","manual":"Dans un récit au passé, l’imparfait sert souvent à décrire le cadre, une habitude ou une action en cours. Le passé simple présente généralement une action achevée qui fait avancer le récit.","teacher":"La pluie tombait quand soudain la porte s’ouvrit : le décor puis l’événement.","example":"« Le vent soufflait ; un éclair illumina le ciel. »","exercise":"Quel temps emploie-t-on pour « il marchait » ?","answer":"L’imparfait de l’indicatif."},"5e|Français|Écrire un récit organisé":{"goal":"Construire un récit","manual":"Un récit comporte une situation initiale, un événement perturbateur, des péripéties, une résolution et une situation finale. Les paragraphes et les connecteurs temporels aident le lecteur à suivre l’action.","teacher":"Pense à une histoire comme à un chemin : début, problème, aventures, solution et fin.","example":"Début : Léa rentre chez elle ; problème : elle perd ses clés ; solution : son voisin les retrouve.","exercise":"Invente une phrase d’élément perturbateur pour une histoire de voyage.","answer":"Exemple : « Au moment de partir, le train disparut du tableau d’affichage. »"},"4e|Français|Propositions et phrases complexes":{"goal":"Repérer les propositions","manual":"Une phrase complexe comporte plusieurs verbes conjugués, généralement autant de propositions. Les propositions peuvent être juxtaposées, coordonnées ou subordonnées. Les mots « parce que », « quand » ou « qui » peuvent introduire une subordonnée.","teacher":"Compte les verbes conjugués, puis cherche le lien entre les morceaux de la phrase.","example":"« Je rentre parce qu’il pleut » contient deux propositions.","exercise":"Combien de propositions dans « Je lis et mon frère dessine » ?","answer":"Deux : « Je lis » et « mon frère dessine »."},"4e|Français|Narration et points de vue":{"goal":"Identifier un point de vue narratif","manual":"Le narrateur raconte l’histoire. Selon ce qu’il sait, le point de vue peut être interne (perceptions d’un personnage), externe (faits observables) ou omniscient (connaissance des pensées de plusieurs personnages).","teacher":"Une caméra voit les gestes ; un personnage ressent ses émotions ; un narrateur omniscient connaît plusieurs esprits.","example":"« Emma tremblait de peur » donne accès à son émotion.","exercise":"Quel point de vue ne décrit que ce qu’un observateur peut voir ?","answer":"Le point de vue externe."},"3e|Français|Réécriture et dictée":{"goal":"Réussir les accords en réécriture","manual":"Une réécriture demande de modifier un paramètre (temps, personne, nombre) en adaptant tous les accords concernés. Pour la dictée, relire séparément accords sujet-verbe, groupes nominaux et homophones grammaticaux.","teacher":"Si « il » devient « ils », pense à changer le verbe et les adjectifs qui se rapportent au sujet.","example":"« Il était heureux » devient « Ils étaient heureux ».","exercise":"Réécris au pluriel : « La jeune fille est arrivée ».","answer":"Les jeunes filles sont arrivées."},"3e|Français|Lecture et interprétation":{"goal":"Justifier une interprétation","manual":"Pour interpréter un texte, on formule une idée et on la justifie par des indices précis : mots, figures de style, point de vue, registre, ponctuation. Une citation courte doit être expliquée, pas simplement recopiée.","teacher":"Réponds en trois temps : je pense que…, je le vois dans…, cela montre que…","example":"« La nuit dévorait la ville » personnifie la nuit et crée une impression inquiétante.","exercise":"Dans « Le vent hurlait », quelle figure de style est utilisée ?","answer":"Une personnification : le vent accomplit une action humaine."},"3e|Français|Préparation au brevet de français":{"goal":"Organiser une réponse de brevet","manual":"L’épreuve de français comprend notamment des questions sur un texte et une image, des exercices de langue, une dictée et une rédaction selon les modalités officielles de la session. Il faut lire les consignes, citer le texte à bon escient et relire les accords.","teacher":"Commence par repérer les mots-clés de chaque question ; garde du temps pour te relire.","example":"Question « Justifiez » : donne une réponse et un indice précis du texte.","exercise":"Pourquoi faut-il relire une rédaction ?","answer":"Pour vérifier la cohérence, la ponctuation, les accords et les fautes d’orthographe."},"6e|Histoire|Récits fondateurs et croyances antiques":{"goal":"Distinguer récit et histoire","manual":"Les récits fondateurs, comme ceux de la Bible ou des mythes grecs, renseignent sur les croyances et les valeurs des sociétés antiques. L’historien les confronte aux vestiges et aux autres sources.","teacher":"Un récit mythologique n’est pas un reportage : il permet de comprendre comment les Anciens expliquaient le monde.","example":"Les poèmes attribués à Homère évoquent les héros et les dieux grecs.","exercise":"Quelle différence existe-t-il entre mythe et source archéologique ?","answer":"Le mythe est un récit transmis ; la source archéologique est une trace matérielle étudiée."},"6e|Géographie|Habiter une métropole":{"goal":"Décrire les espaces métropolitains","manual":"Une métropole concentre population, emplois, services et fonctions de commandement. Elle comporte des quartiers aux fonctions variées et connaît des défis de transport, de logement et d’environnement.","teacher":"Regarde une grande ville : centre, logements, bureaux, transports et espaces verts sont reliés.","example":"Paris est une métropole française connectée au reste du monde.","exercise":"Cite deux difficultés rencontrées dans les métropoles.","answer":"Par exemple les embouteillages et le coût du logement."},"5e|Histoire|Chrétientés et islam (VIe–XIIIe siècles)":{"goal":"Situer les mondes médiévaux","manual":"Entre les VIe et XIIIe siècles, l’Europe chrétienne, l’Empire byzantin et les mondes musulmans développent des pouvoirs, des cultures et des échanges. Les relations comportent des conflits mais aussi des circulations de savoirs et de marchandises.","teacher":"Sur une carte, repère les espaces et leurs principales villes avant d’étudier leurs contacts.","example":"Bagdad et Constantinople sont des centres politiques et culturels majeurs à différentes époques.","exercise":"Les relations entre ces mondes étaient-elles seulement guerrières ?","answer":"Non, elles comportaient aussi commerce et échanges culturels."},"5e|Géographie|Des ressources limitées à gérer et à renouveler":{"goal":"Comprendre la gestion des ressources","manual":"L’eau, l’énergie et les ressources alimentaires sont inégalement réparties et leur usage a des effets sur les milieux. Une gestion durable cherche à satisfaire les besoins actuels tout en préservant les ressources.","teacher":"Une région peut manquer d’eau même si une autre en possède beaucoup : l’accès dépend aussi des infrastructures.","example":"L’irrigation agricole peut accroître les récoltes mais consommer beaucoup d’eau.","exercise":"Donne un exemple d’économie d’eau.","answer":"Réparer les fuites ou utiliser une irrigation plus économe."},"4e|Histoire|Le XVIIIe siècle : expansions, Lumières et révolutions":{"goal":"Relier idées et transformations","manual":"Au XVIIIe siècle, le commerce maritime se développe, y compris la traite atlantique et l’esclavage colonial. Les philosophes des Lumières critiquent l’arbitraire et discutent la liberté. La Révolution française commence en 1789.","teacher":"Ne confonds pas les idées des Lumières et les événements : les premières nourrissent des débats qui précèdent la Révolution.","example":"1789 : prise de la Bastille et Déclaration des droits de l’homme et du citoyen.","exercise":"Quelle année marque le début de la Révolution française ?","answer":"1789."},"4e|Géographie|L’urbanisation du monde":{"goal":"Expliquer l’urbanisation","manual":"L’urbanisation correspond à l’augmentation de la part des habitants vivant en ville. Elle s’accompagne d’une extension des espaces bâtis et de fortes différences entre quartiers et métropoles.","teacher":"Une ville qui grandit doit organiser logements, transports et services pour ses habitants.","example":"Les périphéries urbaines peuvent accueillir de nouveaux logements et zones d’activité.","exercise":"L’urbanisation signifie-t-elle seulement construire des gratte-ciel ?","answer":"Non, c’est surtout l’augmentation de la population urbaine et l’évolution des espaces urbains."},"3e|Histoire|Le monde depuis 1945":{"goal":"Comprendre les grandes évolutions depuis 1945","manual":"Après 1945, la guerre froide oppose principalement les États-Unis et l’URSS. La décolonisation transforme la carte politique du monde. Après 1991, les relations internationales évoluent et de nouveaux conflits apparaissent.","teacher":"Pour retenir cette période, construis une frise : 1945, 1961, 1989, 1991.","example":"1989 : chute du mur de Berlin ; 1991 : disparition de l’URSS.","exercise":"Que signifie « guerre froide » ?","answer":"Une rivalité mondiale entre blocs, sans affrontement militaire direct généralisé entre les deux superpuissances."},"3e|Géographie|La France et l’Union européenne":{"goal":"Situer la France dans l’Europe","manual":"La France est un État membre de l’Union européenne. L’UE est un ensemble politique et économique dont les territoires sont connectés par des échanges et des politiques communes. Tous ses membres n’utilisent pas l’euro.","teacher":"L’Union européenne n’est pas un pays : ce sont des États qui coopèrent dans des domaines définis.","example":"La France échange des biens et des personnes avec ses voisins européens.","exercise":"Tous les pays de l’UE utilisent-ils l’euro ?","answer":"Non, certains États membres conservent leur monnaie nationale."}});
const nav=document.querySelector('.nav');
const btn=document.createElement('button');btn.textContent='🏫 Programmes';btn.setAttribute('data-tab','programmes');nav.prepend(btn);
const pane=document.createElement('section');pane.id='programmePane';pane.className='card';pane.style.display='none';document.querySelector('main').insertBefore(pane,document.getElementById('content'));
function clean(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function show(){
const g=document.getElementById('grade').value||'6e';
let subj=document.getElementById('progSubject')?.value||'Mathématiques';
const avail=Object.keys(PROGRAMS).filter(s=>PROGRAMS[s][g]);
if(!avail.includes(subj))subj=avail[0];
const entries=PROGRAMS[subj][g];
pane.innerHTML='<h2>🏫 Parcours scolaire 2026–2027</h2><p class="program-note"><strong>Important :</strong> les intitulés ci-dessous constituent un parcours pédagogique organisé à partir des grands domaines des programmes, pas une reproduction mot pour mot de chapitres imposés par le ministère. Les leçons développées disponibles sont identifiées ; elles restent des ressources originales de révision, pas des manuels officiels complets. Les autres chapitres sont à rédiger. Les enseignants choisissent leur progression.</p><label>Matière</label><select id="progSubject">'+avail.map(s=>'<option '+(s===subj?'selected':'')+'>'+clean(s)+'</option>').join('')+'</select><h3>'+clean(g)+' — '+clean(subj)+'</h3><p>'+entries.length+' thèmes à travailler · '+entries.filter(x=>FULL[g+'|'+subj+'|'+x]).length+' leçons développées disponibles</p><div id="progItems">'+entries.map((x,i)=>{const key=g+'|'+subj+'|'+x;return '<button class="coursebtn" data-index="'+i+'">'+(i+1)+'. '+clean(x)+(FULL[key]?' ✓ Leçon disponible':' · À rédiger')+'</button>';}).join('')+'</div><div id="progDetail"></div><p class="muted">Référence nationale : <a href="https://www.education.gouv.fr/les-programmes-du-college-470408" target="_blank" rel="noopener">programmes du collège (ministère)</a>. En 2026-2027, les nouveaux programmes de français et mathématiques concernent la 6e et la 5e ; 4e et 3e suivent encore les programmes antérieurs.</p>';
pane.querySelector('#progSubject').addEventListener('change',show);
pane.querySelectorAll('[data-index]').forEach(b=>b.addEventListener('click',()=>{
const name=entries[+b.dataset.index],l=FULL[g+'|'+subj+'|'+name],target=pane.querySelector('#progDetail');
if(!l){target.innerHTML='<div class="course-detail"><h3>'+clean(name)+'</h3><p>Leçon détaillée non encore disponible. Ce thème est inscrit dans le parcours de rédaction ; aucun faux cours ne sera affiché.</p></div>';target.scrollIntoView({behavior:'smooth',block:'nearest'});return;}
target.innerHTML='<div class="course-detail"><h3>'+clean(name)+'</h3><p><strong>Objectif :</strong> '+clean(l.goal)+'</p><h3>📖 Mode manuel scolaire</h3><p>'+clean(l.manual)+'</p><h3>👩‍🏫 Mode professeur</h3><p>'+clean(l.teacher)+'</p><h3>Exemple expliqué</h3><p>'+clean(l.example)+'</p><h3>✏️ Exercice d’application</h3><p>'+clean(l.exercise)+'</p><details><summary><strong>Voir la correction</strong></summary><p>'+clean(l.answer)+'</p></details></div>';target.scrollIntoView({behavior:'smooth',block:'nearest'});
}));
}
nav.addEventListener('click',e=>{const b=e.target.closest('[data-tab]');if(!b)return;setTimeout(()=>{const is=b.dataset.tab==='programmes';pane.style.display=is?'block':'none';document.getElementById('content').style.display=is?'none':'';document.getElementById('selectors').style.display='';if(is)show();},0)});
document.getElementById('grade').addEventListener('change',()=>{if(pane.style.display==='block')show()});
})();
</script></body></html>
